$:
  vscode:
    - name: preview-album
      docker:
        build: .ide/Dockerfile
      services:
        - name: vscode
          options:
            onlyPreview: true
            launch: python3 -m http.server 8686 --bind 0.0.0.0
            keepAliveTimeout: 30m
            daemon: true

main:
  push:
    - name: build-and-push-image
      services:
        - docker
      env:
        IMAGE_NAME: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
        CACHE_NAME: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:buildx-cache
      stages:
        - name: build and push multi-arch image
          script: |
            docker login -u "${CNB_TOKEN_USER_NAME}" -p "${CNB_TOKEN}" "${CNB_DOCKER_REGISTRY}"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -t "${IMAGE_NAME}" \
              --cache-from "type=registry,ref=${CACHE_NAME}" \
              --cache-to "type=registry,ref=${CACHE_NAME},mode=max,image-manifest=true,oci-mediatypes=true" \
              --push .
